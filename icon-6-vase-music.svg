<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4b8c"/>
      <stop offset="100%" style="stop-color:#0f3a6f"/>
    </linearGradient>
  </defs>
  
  <!-- 钴蓝背景 -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg6)"/>
  
  <!-- 中心白色花瓶轮廓 -->
  <g transform="translate(512,480)">
    <!-- 花瓶主体 -->
    <path d="M-40,-240 Q-35,-220 -50,-180 Q-80,-140 -120,-80 Q-150,-20 -150,40 Q-150,120 -120,180 Q-80,230 -40,250 L40,250 Q80,230 120,180 Q150,120 150,40 Q150,-20 120,-80 Q80,-140 50,-180 Q35,-220 40,-240 Z"
          fill="#f8f4ec" stroke="none"/>
    
    <!-- 花瓶口 -->
    <ellipse cx="0" cy="-240" rx="50" ry="12" fill="#f8f4ec" stroke="#1a4b8c" stroke-width="2" opacity="0.5"/>
    
    <!-- 花瓶底座 -->
    <rect x="-50" y="250" width="100" height="15" rx="5" fill="#f8f4ec" stroke="#1a4b8c" stroke-width="1.5" opacity="0.5"/>
    
    <!-- 花瓶内花纹 - 青花图案 -->
    <!-- 梅花枝 -->
    <g stroke="#1a4b8c" fill="none" stroke-width="2" opacity="0.5">
      <path d="M-30,200 Q-40,140 -20,80 Q0,20 20,-40 Q30,-80 20,-120"/>
      <path d="M-20,80 Q-50,60 -60,40"/>
      <path d="M0,20 Q30,0 50,-10"/>
      <path d="M20,-40 Q-10,-60 -20,-80"/>
    </g>
    
    <!-- 梅花 -->
    <g fill="#1a4b8c" opacity="0.6">
      <circle cx="-60" cy="40" r="8"/>
      <circle cx="-55" cy="30" r="8"/>
      <circle cx="-50" cy="40" r="8"/>
      <circle cx="-55" cy="50" r="8"/>
      <circle cx="-65" cy="45" r="8"/>
      <circle cx="-57" cy="40" r="4" fill="#f8f4ec"/>
      
      <circle cx="50" cy="-10" r="8"/>
      <circle cx="55" cy="-20" r="8"/>
      <circle cx="60" cy="-10" r="8"/>
      <circle cx="55" cy="0" r="8"/>
      <circle cx="45" cy="-5" r="8"/>
      <circle cx="53" cy="-10" r="4" fill="#f8f4ec"/>
      
      <circle cx="-20" cy="-80" r="7"/>
      <circle cx="-15" cy="-90" r="7"/>
      <circle cx="-10" cy="-80" r="7"/>
      <circle cx="-15" cy="-70" r="7"/>
      <circle cx="-25" cy="-75" r="7"/>
      <circle cx="-17" cy="-80" r="3.5" fill="#f8f4ec"/>
    </g>
    
    <!-- 从花瓶中飘出的音符 -->
    <g fill="#f8f4ec">
      <!-- 大音符 -->
      <g transform="translate(0,-300) scale(0.8)">
        <ellipse cx="0" cy="0" rx="35" ry="24" transform="rotate(-20)"/>
        <rect x="22" y="-80" width="8" height="80"/>
        <path d="M30,-80 Q55,-90 55,-65 Q55,-55 40,-48" fill="none" stroke="#f8f4ec" stroke-width="6" stroke-linecap="round"/>
      </g>
      
      <!-- 小音符1 -->
      <g transform="translate(-100,-340) scale(0.5)" opacity="0.7">
        <ellipse cx="0" cy="0" rx="25" ry="17" transform="rotate(-15)"/>
        <rect x="15" y="-50" width="5" height="50"/>
      </g>
      
      <!-- 小音符2 -->
      <g transform="translate(100,-320) scale(0.45)" opacity="0.6">
        <ellipse cx="0" cy="0" rx="22" ry="15" transform="rotate(-10)"/>
        <rect x="13" y="-45" width="5" height="45"/>
        <path d="M18,-45 Q35,-52 35,-35" fill="none" stroke="#f8f4ec" stroke-width="4" stroke-linecap="round"/>
      </g>
      
      <!-- 小音符3 -->
      <g transform="translate(50,-380) scale(0.35)" opacity="0.5">
        <ellipse cx="0" cy="0" rx="20" ry="14" transform="rotate(-15)"/>
        <rect x="12" y="-40" width="4" height="40"/>
      </g>
    </g>
  </g>
  
  <!-- 声波线（从花瓶向外扩散） -->
  <g stroke="#f8f4ec" fill="none" opacity="0.15" stroke-width="2">
    <path d="M200,480 Q180,440 200,400 Q220,360 200,320"/>
    <path d="M160,500 Q130,450 160,400 Q190,350 160,300"/>
    <path d="M824,480 Q844,440 824,400 Q804,360 824,320"/>
    <path d="M864,500 Q894,450 864,400 Q834,350 864,300"/>
  </g>
  
  <!-- 底部文字 -->
  <text x="512" y="900" text-anchor="middle" font-family="serif" font-size="48" fill="#d6e4f2" opacity="0.5" letter-spacing="24">清 音</text>
</svg>