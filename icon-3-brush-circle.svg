<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f4ec"/>
      <stop offset="100%" style="stop-color:#f2ece0"/>
    </linearGradient>
    <linearGradient id="brushStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a4b8c; stop-opacity:0.6"/>
      <stop offset="30%" style="stop-color:#1a4b8c; stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#1a4b8c; stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a4b8c; stop-opacity:0.6"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg3)"/>
  
  <!-- 毛笔书法圆圈（水墨笔触效果） -->
  <g transform="translate(512,460)">
    <!-- 外圈笔触 -->
    <path d="M-260,-10 Q-280,-180 -150,-270 Q-20,-350 150,-270 Q300,-180 290,-10 Q280,180 150,270 Q20,350 -150,270 Q-280,180 -260,-10 Z"
          fill="none" stroke="url(#brushStroke)" stroke-width="28" stroke-linecap="round"
          stroke-dasharray="none" opacity="0.9"/>
    
    <!-- 笔触起笔处（左上角加粗） -->
    <path d="M-265,-20 Q-270,-60 -260,-10" fill="none" stroke="#1a4b8c" stroke-width="36" stroke-linecap="round" opacity="0.7"/>
    
    <!-- 笔触收尾处（右上角渐细） -->
    <path d="M285,0 Q295,-5 290,-10" fill="none" stroke="#1a4b8c" stroke-width="16" stroke-linecap="round" opacity="0.5"/>
  </g>
  
  <!-- 中心音符 -->
  <g transform="translate(512,440)">
    <!-- 音符头 -->
    <ellipse cx="0" cy="60" rx="55" ry="38" fill="#1a4b8c" transform="rotate(-15,0,60)"/>
    <!-- 符干 -->
    <rect x="42" y="-120" width="10" height="180" fill="#1a4b8c"/>
    <!-- 符尾（双符尾 = 十六分音符） -->
    <path d="M52,-120 Q90,-135 90,-105" fill="none" stroke="#1a4b8c" stroke-width="8" stroke-linecap="round"/>
    <path d="M52,-95 Q85,-108 85,-80" fill="none" stroke="#1a4b8c" stroke-width="7" stroke-linecap="round"/>
  </g>
  
  <!-- 小波纹装饰 -->
  <g opacity="0.15">
    <path d="M160,750 Q200,730 240,750 Q280,770 320,750" fill="none" stroke="#6a9e96" stroke-width="3"/>
    <path d="M680,750 Q720,730 760,750 Q800,770 840,750" fill="none" stroke="#6a9e96" stroke-width="3"/>
  </g>
  
  <!-- 底部「清音」文字 -->
  <text x="512" y="880" text-anchor="middle" font-family="serif" font-size="64" font-weight="300" fill="#1a4b8c" opacity="0.6" letter-spacing="20">清音</text>
  
  <!-- 印章（右下角） -->
  <g transform="translate(780,820)">
    <rect x="-30" y="-30" width="60" height="60" rx="4" fill="#c0392b" opacity="0.7"/>
    <text x="0" y="8" text-anchor="middle" font-family="serif" font-size="28" fill="#f8f4ec" opacity="0.9">音</text>
  </g>
</svg>