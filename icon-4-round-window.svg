<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4b8c"/>
      <stop offset="50%" style="stop-color:#0f3a6f"/>
      <stop offset="100%" style="stop-color:#0a2d5a"/>
    </linearGradient>
    <radialGradient id="porcelainCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f8f4ec"/>
    </radialGradient>
  </defs>
  
  <!-- 钴蓝深色背景 -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg4)"/>
  
  <!-- 青花瓷圆窗 -->
  <circle cx="512" cy="480" r="340" fill="url(#porcelainCenter)"/>
  <circle cx="512" cy="480" r="340" fill="none" stroke="#f8f4ec" stroke-width="8" opacity="0.3"/>
  <circle cx="512" cy="480" r="325" fill="none" stroke="#1a4b8c" stroke-width="2" opacity="0.3"/>
  
  <!-- 圆窗内青花瓷花纹 -->
  <g transform="translate(512,480)">
    <!-- 外圈装饰环 -->
    <circle cx="0" cy="0" r="290" fill="none" stroke="#1a4b8c" stroke-width="1.5" opacity="0.15"/>
    
    <!-- 藤蔓花纹（8组对称） -->
    <g opacity="0.35">
      <g transform="rotate(0)">
        <path d="M0,-280 Q30,-250 20,-220 Q10,-200 0,-200" fill="none" stroke="#1a4b8c" stroke-width="2.5"/>
        <circle cx="20" cy="-230" r="6" fill="#1a4b8c" opacity="0.5"/>
      </g>
      <g transform="rotate(45)">
        <path d="M0,-280 Q30,-250 20,-220 Q10,-200 0,-200" fill="none" stroke="#1a4b8c" stroke-width="2.5"/>
        <circle cx="20" cy="-230" r="6" fill="#1a4b8c" opacity="0.5"/>
      </g>
      <g transform="rotate(90)">
        <path d="M0,-280 Q30,-250 20,-220 Q10,-200 0,-200" fill="none" stroke="#1a4b8c" stroke-width="2.5"/>
        <circle cx="20" cy="-230" r="6" fill="#1a4b8c" opacity="0.5"/>
      </g>
      <g transform="rotate(135)">
        <path d="M0,-280 Q30,-250 20,-220 Q10,-200 0,-200" fill="none" stroke="#1a4b8c" stroke-width="2.5"/>
        <circle cx="20" cy="-230" r="6" fill="#1a4b8c" opacity="0.5"/>
      </g>
      <g transform="rotate(180)">
        <path d="M0,-280 Q30,-250 20,-220 Q10,-200 0,-200" fill="none" stroke="#1a4b8c" stroke-width="2.5"/>
        <circle cx="20" cy="-230" r="6" fill="#1a4b8c" opacity="0.5"/>
      </g>
      <g transform="rotate(225)">
        <path d="M0,-280 Q30,-250 20,-220 Q10,-200 0,-200" fill="none" stroke="#1a4b8c" stroke-width="2.5"/>
        <circle cx="20" cy="-230" r="6" fill="#1a4b8c" opacity="0.5"/>
      </g>
      <g transform="rotate(270)">
        <path d="M0,-280 Q30,-250 20,-220 Q10,-200 0,-200" fill="none" stroke="#1a4b8c" stroke-width="2.5"/>
        <circle cx="20" cy="-230" r="6" fill="#1a4b8c" opacity="0.5"/>
      </g>
      <g transform="rotate(315)">
        <path d="M0,-280 Q30,-250 20,-220 Q10,-200 0,-200" fill="none" stroke="#1a4b8c" stroke-width="2.5"/>
        <circle cx="20" cy="-230" r="6" fill="#1a4b8c" opacity="0.5"/>
      </g>
    </g>
    
    <!-- 内圈莲花 -->
    <g opacity="0.7">
      <!-- 大花瓣 -->
      <ellipse cx="0" cy="-100" rx="28" ry="55" fill="#1a4b8c" transform="rotate(0)"/>
      <ellipse cx="0" cy="-100" rx="28" ry="55" fill="#1a4b8c" transform="rotate(60)"/>
      <ellipse cx="0" cy="-100" rx="28" ry="55" fill="#1a4b8c" transform="rotate(120)"/>
      <ellipse cx="0" cy="-100" rx="28" ry="55" fill="#1a4b8c" transform="rotate(180)"/>
      <ellipse cx="0" cy="-100" rx="28" ry="55" fill="#1a4b8c" transform="rotate(240)"/>
      <ellipse cx="0" cy="-100" rx="28" ry="55" fill="#1a4b8c" transform="rotate(300)"/>
    </g>
    <g opacity="0.45">
      <!-- 小花瓣（错位） -->
      <ellipse cx="0" cy="-65" rx="18" ry="35" fill="#2a6cb8" transform="rotate(30)"/>
      <ellipse cx="0" cy="-65" rx="18" ry="35" fill="#2a6cb8" transform="rotate(90)"/>
      <ellipse cx="0" cy="-65" rx="18" ry="35" fill="#2a6cb8" transform="rotate(150)"/>
      <ellipse cx="0" cy="-65" rx="18" ry="35" fill="#2a6cb8" transform="rotate(210)"/>
      <ellipse cx="0" cy="-65" rx="18" ry="35" fill="#2a6cb8" transform="rotate(270)"/>
      <ellipse cx="0" cy="-65" rx="18" ry="35" fill="#2a6cb8" transform="rotate(330)"/>
    </g>
    
    <!-- 花心 -->
    <circle cx="0" cy="0" r="25" fill="#1a4b8c"/>
    <circle cx="0" cy="0" r="12" fill="#f8f4ec"/>
  </g>
  
  <!-- 音乐符号（白色，在蓝色背景上） -->
  <g transform="translate(512,480)" fill="#f8f4ec" opacity="0.95">
    <ellipse cx="-25" cy="30" rx="35" ry="25" transform="rotate(-20,-25,30)"/>
    <rect x="2" y="-80" width="8" height="110"/>
    <path d="M10,-80 Q35,-90 35,-65 Q35,-55 20,-48" fill="none" stroke="#f8f4ec" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- 底部装饰线 -->
  <line x1="300" y1="870" x2="724" y2="870" stroke="#f8f4ec" stroke-width="1" opacity="0.2"/>
  
  <!-- 底部文字 -->
  <text x="512" y="920" text-anchor="middle" font-family="serif" font-size="42" fill="#d6e4f2" opacity="0.6" letter-spacing="16">清 音</text>
</svg>