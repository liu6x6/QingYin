name: QingYin
targets:
  # iOS 目标（同时支持 Mac Catalyst）
  QingYin_iOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: QingYin
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: QingYin/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.qingyin.app.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        # 启用 iCloud 同步时需要设置:
        # CODE_SIGN_ENTITLEMENTS: QingYin/QingYin.entitlements
    info:
      path: QingYin/Info.plist
      properties:
        CFBundleName: QingYin
        CFBundleDisplayName: 清音
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: YES
        UIApplicationSupportsIndirectInputEvents: YES
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: NO
        UILaunchStoryboardName: LaunchScreen
        UIViewControllerBasedStatusBarAppearance: NO
        UIStatusBarStyle: UIStatusBarStyleDefault
        NSAppleMusicUsageDescription: 清音需要访问您的音乐库以播放本地音乐。
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
      - sdk: Combine.framework

  # 原生 macOS 目标
  QingYin_macOS:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: QingYin
        excludes:
          - Info*.plist
    settings:
      base:
        INFOPLIST_FILE: QingYin/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.qingyin.app.macos
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        # 启用 iCloud 同步时需要设置:
        # CODE_SIGN_ENTITLEMENTS: QingYin/QingYin.entitlements
    info:
      path: QingYin/Info-macOS.plist
      properties:
        CFBundleName: QingYin
        CFBundleDisplayName: 清音
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSAppleMusicUsageDescription: 清音需要访问您的音乐库以播放本地音乐。
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: AVFoundation.framework
      - sdk: Combine.framework
